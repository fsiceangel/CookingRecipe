<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="description" content="A personal recipe book. Find a familiar dish, gather your ingredients, and cook at your own pace." />
    <title>我的食谱 · Cooking Recipe</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      try {
        const stored = localStorage.getItem('recipe.theme');
        const theme = stored ? JSON.parse(stored) : localStorage.getItem('theme');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <style>html{background:#f4f7fb;color-scheme:light}html[data-theme=dark]{background:#181d25;color-scheme:dark}body{margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
